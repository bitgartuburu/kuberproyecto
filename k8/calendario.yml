apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendario-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calendario
  template:
    metadata:
      labels:
        app: calendario
    spec:
      containers:
      - name: contenedor-calendario
        image: calendario:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: calendario-service
spec:
  selector:
    app: calendario
  ports:
  - protocol: TCP
    port: 5001
    targetPort: 5001
  type: ClusterIP