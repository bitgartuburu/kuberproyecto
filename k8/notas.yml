apiVersion: apps/v1
kind: Deployment
metadata:
  name: notas-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notas
  template:
    metadata:
      labels:
        app: notas
    spec:
      containers:
      - name: contenedor-notas
        image: notas:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: notas-service
spec:
  selector:
    app: notas
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
  type: ClusterIP